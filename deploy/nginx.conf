# One public port, two processes behind it.
#
# A Hugging Face Space or a Cloud Run service exposes a single port, but
# this app is a FastAPI service and a Streamlit page that talk to each
# other. Google's OAuth callback has to reach the API from the open
# internet, while everything a person looks at is the Streamlit side -- so
# the two are split by path rather than by port.
#
# Same origin for both, which is what makes the br_session cookie set by
# /auth/google/callback readable by the Streamlit page afterwards.
#
# `listen __PORT__;` below is a placeholder, not valid nginx on its own --
# start.sh substitutes the platform's actual port into it before this file
# is read. Cloud Run assigns its own port per revision (usually 8080, but
# never assume); Hugging Face Spaces and a plain `docker run` both expect
# 7860. Templating this is what lets the one image serve both.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  access_log off;

  # Streamlit's file uploader and the export zip both move real data.
  client_max_body_size 64m;

  # The long model calls: a screening run over ten papers with two vendors
  # takes over a minute, and a full-text read takes longer. The default 60s
  # would cut those off mid-answer.
  proxy_read_timeout 900s;
  proxy_send_timeout 900s;

  # Scratch paths under /tmp: the container runs as a non-root user and
  # cannot write nginx's default locations.
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen __PORT__;
    server_name _;

    # The OAuth callback and the API the page calls.
    location /auth/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Everything else is the page. Streamlit runs on a websocket, so the
    # upgrade headers are not optional -- without them the app loads and
    # then sits there saying "connecting".
    location / {
      proxy_pass http://127.0.0.1:8501;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
    }
  }
}
