# Week 14 -- gap discovery, second/third AI arm. Smid_2020.
#
# The supervisor asked that gap detection be cross-checked by two AIs. The
# existing arm is qwen2.5:7b-instruct (local, $0); this is the openai arm over
# the SAME 9 verified-include records from the SAME source run, so the only
# thing that differs between arms is the model.
#
# OpenAI. Prices are from third-party aggregators that disagree with each
# other; confirm on platform.openai.com/pricing before running. No free tier:
# the account needs a prepaid balance (USD 5 minimum) before the first call.
#
# Estimated cost: $0.001 (9 records, ~805 input + ~113 output tokens each,
# measured from this project's own prompts and cached responses on 16 Oct).
# ceiling_usd is set to $0.25 -- roughly 6x the estimate, so a surprise
# (reasoning tokens billed as output, a price change) ABORTS the run rather
# than arriving as a bill. The ceiling aborts; it does not warn.
#
# Before running:
#   1. OPENAI_API_KEY in .env (gitignored -- verify: git check-ignore -v .env)
#   2. Commit, then run with --require-clean.

name: gap_openai_smid2020

source_run_id: 20260918T060412811907Z-2556bbe54c
review: Smid_2020
max_records: null

provider: openai
model: gpt-5-nano
prompt_version: gap_v1
temperature: 0.0
max_output_tokens: 512
max_retries: 3
seed: 42

ceiling_usd: 0.25
usd_per_1m_input: 0.05
usd_per_1m_output: 0.4

db_path: data/slr.db
runs_dir: runs
prompts_dir: prompts
cache_enabled: true
