# Ingest-only config for a fresh clone: loads all six evaluation-subset
# reviews in one command, screening disabled, no cost. Used by the
# reproduction steps in SETUP.md (week 13 exit test: a fresh clone runs on
# a second machine).

name: ingest_all

dataset:
  reviews:
    - Radjenovic_2013      # 5,935 records, 0.8% inclusion
    - Smid_2020            # 2,627 records, 1.0% inclusion
    - van_der_Waal_2022    # 1,970 records, 1.7% inclusion
    - Menon_2022           #   975 records, 7.6% inclusion
    - van_der_Valk_2021    #   725 records, 12.3% inclusion
    - Nelson_2002          #   366 records, 21.9% inclusion
  max_records: null
  seed: 42

screening:
  enabled: false

db_path: data/slr.db
runs_dir: runs
prompts_dir: prompts
