# Week 14 -- gap discovery, second/third AI arm. van_der_Valk_2021.
#
# The supervisor asked that gap detection be cross-checked by two AIs. The
# existing arm is qwen2.5:7b-instruct (local, $0); this is the gemini arm over
# the SAME 11 verified-include records from the SAME source run, so the only
# thing that differs between arms is the model.
#
# Google AI Studio. Price verified 2 October 2026; re-check
# ai.google.dev/gemini-api/docs/pricing before running -- it has moved once already.
#
# Estimated cost: $0.006 (11 records, ~805 input + ~113 output tokens each,
# measured from this project's own prompts and cached responses on 16 Oct).
# ceiling_usd is set to $0.25 -- roughly 6x the estimate, so a surprise
# (reasoning tokens billed as output, a price change) ABORTS the run rather
# than arriving as a bill. The ceiling aborts; it does not warn.
#
# Before running:
#   1. GEMINI_API_KEY in .env (gitignored -- verify: git check-ignore -v .env)
#   2. Commit, then run with --require-clean.

