# van_der_Valk_2021 — screening on real data, local Ollama. Added outside the
# original week 8/9 schedule, at the same time as the data-extraction feature:
# a third review to extract from, chosen for its prevalence (12.3%, between
# Smid_2020's 1.0% and Nelson_2002's 21.9%) and domain (medicine, psychology).
#
# Before running:
#   1. Ingest first: python -m slr.services.ingest --config configs/valk2021_ollama.yaml
#   2. Ollama running locally, qwen2.5:7b-instruct pulled (already true).
#   3. Commit, then run with --require-clean.

name: valk2021_ollama_qwen25_7b

dataset:
  reviews:
    - van_der_Valk_2021   # 725 records, 12.3% inclusion
  max_records: null        # every record
  seed: 42

ranking:
  strategy: random
  recall_target: 0.95

screening:
  enabled: true
  provider: ollama
  model: qwen2.5:7b-instruct
  prompt_version: screen_v1
  temperature: 0.0
  max_output_tokens: 512
  max_retries: 3
  seed: 42

budget:
  ceiling_usd: 0.00
  usd_per_1m_input: 0.0    # local GPU inference; no per-token API cost
  usd_per_1m_output: 0.0

db_path: data/slr.db
runs_dir: runs
prompts_dir: prompts
cache_enabled: true
