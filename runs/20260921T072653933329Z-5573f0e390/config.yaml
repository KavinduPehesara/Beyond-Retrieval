# Radjenović_2013 — screening on real data, local Ollama. Fourth review
# added outside the original week 8/9 schedule, chosen for domain diversity:
# the only software-engineering review besides Smid_2020's CS-methodology
# one, at the lowest prevalence in the subset (0.8%).
#
# Before running:
#   1. Ingest first: python -m slr.services.ingest --config configs/radjenovic2013_ollama.yaml
#   2. Ollama running locally, qwen2.5:7b-instruct pulled (already true).
#   3. Commit, then run with --require-clean.
#
# Size: 5,935 records — the largest of the four reviews screened so far
# (~2x Smid_2020). Single run only, not run-twice-for-reproducibility: that
# property has already been proven byte-identical three times (week 8 x2,
# van_der_Valk_2021 x1) and re-proving it here just doubles a ~110 minute
# run for no new information.

name: radjenovic2013_ollama_qwen25_7b

dataset:
  reviews:
    - Radjenovic_2013   # 5,935 records, 0.8% inclusion
  max_records: null
  seed: 42

ranking:
  strategy: random
  recall_target: 0.95

screening:
  enabled: true
  provider: ollama
  model: qwen2.5:7b-instruct
  prompt_version: screen_v1
  temperature: 0.0
  max_output_tokens: 512
  max_retries: 3
  seed: 42

budget:
  ceiling_usd: 0.00
  usd_per_1m_input: 0.0    # local GPU inference; no per-token API cost
  usd_per_1m_output: 0.0

db_path: data/slr.db
runs_dir: runs
prompts_dir: prompts
cache_enabled: true
