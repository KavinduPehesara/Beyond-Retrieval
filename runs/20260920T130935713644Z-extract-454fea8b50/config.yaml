# Data extraction demo — Smid_2020, week of 20 September 2026. Runs over the
# week 8 screening run's verified-include records for Smid_2020 (only 10
# records — a simulation-methodology review, so study_design/sample_size/
# country may not apply the way they do for Nelson_2002's clinical trials;
# run for comparison, not because a bigger table was expected here).
#
# Before running:
#   1. Ollama running locally, qwen2.5:7b-instruct pulled (already true from
#      week 8).
#   2. Commit, then run with --require-clean.

name: extract_demo_smid2020

source_run_id: 20260918T060412811907Z-2556bbe54c
review: Smid_2020
max_records: null   # every verified-include record from the source run

provider: ollama
model: qwen2.5:7b-instruct
prompt_version: extract_v1
temperature: 0.0
max_output_tokens: 512
max_retries: 3
seed: 42

ceiling_usd: 0.00
usd_per_1m_input: 0.0    # local GPU inference; no per-token API cost
usd_per_1m_output: 0.0

db_path: data/slr.db
runs_dir: runs
prompts_dir: prompts
cache_enabled: true
