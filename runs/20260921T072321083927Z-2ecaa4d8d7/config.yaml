# Week 9 — BM25 re-run across all three currently-ingested reviews, for a
# fair comparison against dense/hybrid/rerank. The original baseline_bm25.yaml
# only covers Smid_2020/Nelson_2002 (added week 8, before van_der_Valk_2021
# was ingested) and stays untouched as that historical artifact.
#
# No model calls, no cost.

name: week09_baseline_bm25

dataset:
  reviews:
    - Smid_2020            # 2,627 records, 1.0% inclusion
    - Nelson_2002           # 366 records, 21.9% inclusion
    - van_der_Valk_2021     # 725 records, 12.3% inclusion
  max_records: null
  seed: 42

ranking:
  strategy: bm25
  recall_target: 0.95

screening:
  enabled: false

db_path: data/slr.db
runs_dir: runs
prompts_dir: prompts
