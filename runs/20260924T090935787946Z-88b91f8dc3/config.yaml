# The last two reviews of the six-review subset — van_der_Waal_2022 (1,970
# records, 1.7%) and Menon_2022 (975 records, 7.6%), both medicine. Screened
# with the same model/prompt/settings as every prior real run so their
# figures sit alongside the other four, and so their verified-includes can
# feed gap discovery (week 11 shortfall: 21 rated statements vs. the 30
# planned).
#
# Before running:
#   1. Ingest first: python -m slr.services.ingest --config configs/remaining_reviews_ollama.yaml
#   2. Ollama running locally, qwen2.5:7b-instruct pulled (already true).
#   3. Commit, then run with --require-clean. Do not kill it mid-review:
#      harness.py only commits once a review's full loop completes, so a
#      kill discards that review's progress (see the Radjenovic_2013 note).

name: remaining_reviews_ollama_qwen25_7b

dataset:
  reviews:
    - Menon_2022            # 975 records, 7.6% inclusion
    - van_der_Waal_2022     # 1,970 records, 1.7% inclusion
  max_records: null
  seed: 42

ranking:
  strategy: random
  recall_target: 0.95

screening:
  enabled: true
  provider: ollama
  model: qwen2.5:7b-instruct
  prompt_version: screen_v1
  temperature: 0.0
  max_output_tokens: 512
  max_retries: 3
  seed: 42

budget:
  ceiling_usd: 0.00
  usd_per_1m_input: 0.0
  usd_per_1m_output: 0.0

db_path: data/slr.db
runs_dir: runs
prompts_dir: prompts
cache_enabled: true
